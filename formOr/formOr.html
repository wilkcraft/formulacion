<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index Formulación Orgánica</title>
    <link rel="icon" href="../media/form.png" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f4f8;
      }
      .container {
        text-align: center;
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        font-size: 24px;
        color: #333;
        margin-bottom: 20px;
      }
      .btn {
        transition: all 0.3s ease-in-out;
        font-family: "Dosis", sans-serif;
        width: auto;
        height: 40px;
        border-radius: 5px;
        background-image: linear-gradient(
          135deg,
          #149cea 0%,
          #0d7ac2 100%
        ); /* Nuevo gradiente */
        outline: none;
        cursor: pointer;
        border: none;
        font-size: 14px;
        color: white;
        margin: 10px; /* Añade margen entre los botones */
        padding: 0 20px;
      }

      .btn:hover {
        transform: translateY(3px);
        box-shadow: none;
      }

      .btn:active {
        opacity: 0.5;
      }

      .green-button {
        display: inline-block; /* Hace que el botón se ajuste al contenido */
        position: relative;
        height: 3.5em;
        padding: 0 1em; /* Añade padding horizontal para que el texto no esté pegado a los bordes */
        border: 3px ridge #218838;
        outline: none;
        background-color: transparent;
        color: black;
        transition: 1s;
        border-radius: 0.3em;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap; /* Evita que el texto se divida en varias líneas */
        margin-top: 1px;
      }

      .green-button::after {
        content: "";
        position: absolute;
        top: -10px;
        left: 3%;
        width: 95%;
        height: 40%;
        background-color: white;
        transition: 0.5s;
        transform-origin: center;
      }

      .green-button::before {
        content: "";
        transform-origin: center;
        position: absolute;
        top: 80%;
        left: 3%;
        width: 95%;
        height: 40%;
        background-color: white;
        transition: 0.5s;
      }

      .green-button:hover::before,
      .green-button:hover::after {
        transform: scale(0);
      }

      .green-button:hover {
        box-shadow: inset 0px 0px 25px #218838;
        background-color: rgba(33, 136, 56, 0.1);
      }

      .orange-button {
        display: inline-block;
        position: relative;
        height: 3.5em;
        padding: 0 1em;
        border: 3px ridge #ffc107;
        outline: none;
        background-color: transparent;
        color: black;
        transition: 1s;
        border-radius: 0.3em;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
        margin-top: 1px;
      }
      .orange-button::after,
      .orange-button::before {
        content: "";
        position: absolute;
        width: 95%;
        height: 40%;
        background-color: white;
        transition: 0.5s;
        transform-origin: center;
      }
      .orange-button::after {
        top: -10px;
        left: 3%;
      }
      .orange-button::before {
        top: 80%;
        left: 3%;
      }
      .orange-button:hover::before,
      .orange-button:hover::after {
        transform: scale(0);
      }
      .orange-button:hover {
        box-shadow: inset 0px 0px 15px #ffc107;
        background-color: rgba(161, 128, 43, 0.1);
      }

      .button-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }

      .floating-edit-button {
        position: fixed;
        top: 15px;
        left: 15px;
        z-index: 1000;

        padding: 10px 16px;
        border-radius: 8px;
        border: 2px solid #6f42c1;
        background-color: #6f42c1;
        color: white;
        font-weight: bold;
        cursor: pointer;

        transition: 0.2s ease-in-out;
      }

      .floating-edit-button:hover {
        transform: scale(1.05);
        background-color: #5a32a3;
      }

      .red-button {
        display: inline-block;
        position: relative;
        height: 3.5em;
        padding: 0 1em;
        border: 3px ridge #dc3545;
        outline: none;
        background-color: transparent;
        color: black;
        transition: 1s;
        border-radius: 0.3em;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
        margin-top: 1px;
      }

      .red-button::after,
      .red-button::before {
        content: "";
        position: absolute;
        width: 95%;
        height: 40%;
        background-color: white;
        transition: 0.5s;
        transform-origin: center;
      }

      .red-button::after {
        top: -10px;
        left: 3%;
      }

      .red-button::before {
        top: 80%;
        left: 3%;
      }

      .red-button:hover::before,
      .red-button:hover::after {
        transform: scale(0);
      }

      .red-button:hover {
        box-shadow: inset 0px 0px 15px #dc3545;
        background-color: rgba(220, 53, 69, 0.1);
      }

      @media (max-width: 768px) {
        body {
          height: 100dvh;
          padding: 0 15px 0 15px;
          align-items: center;
          justify-content: center;
        }

        .container {
          width: 100%;
          max-width: 100%;
          padding: 15px;
          border-radius: 8px;
        }

        h1 {
          font-size: 20px;
        }

        /* Mejora UX táctil */
        button {
          touch-action: manipulation;
        }
      }

      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121212;
          color: #e0e0e0; /* Texto más claro */
        }

        .container {
          background-color: #1e1e1e;
          box-shadow: 0 4px 6px rgba(255, 255, 255, 0.1);
        }

        h1 {
          color: #e0e0e0; /* Título más claro */
        }

        .green-button {
          display: inline-block; /* Hace que el botón se ajuste al contenido */
          position: relative;
          height: 3.5em;
          padding: 0 1em; /* Añade padding horizontal para que el texto no esté pegado a los bordes */
          border: 3px ridge #218838;
          outline: none;
          background-color: transparent;
          color: #e0e0e0;
          transition: 1s;
          border-radius: 0.3em;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          white-space: nowrap; /* Evita que el texto se divida en varias líneas */
          margin-top: 1px;
        }

        .green-button::after {
          content: "";
          position: absolute;
          top: -10px;
          left: 3%;
          width: 95%;
          height: 40%;
          background-color: #1e1e1e;
          transition: 0.5s;
          transform-origin: center;
        }

        .green-button::before {
          content: "";
          transform-origin: center;
          position: absolute;
          top: 80%;
          left: 3%;
          width: 95%;
          height: 40%;
          background-color: #1e1e1e;
          transition: 0.5s;
        }

        .green-button:hover::before,
        .green-button:hover::after {
          transform: scale(0);
        }

        .green-button:hover {
          box-shadow: inset 0px 0px 25px #218838;
          background-color: rgba(33, 136, 56, 0.1);
        }
        .orange-button {
          display: inline-block;
          position: relative;
          height: 3.5em;
          padding: 0 1em;
          border: 3px ridge #ffc107;
          outline: none;
          background-color: transparent;
          color: #e0e0e0;
          transition: 1s;
          border-radius: 0.3em;
          font-size: 16px;
          font-weight: bold;
          cursor: pointer;
          white-space: nowrap;
          margin-top: 1px;
        }
        .orange-button::after,
        .orange-button::before {
          content: "";
          position: absolute;
          width: 95%;
          height: 40%;
          background-color: #1e1e1e;
          transition: 0.5s;
          transform-origin: center;
        }
        .orange-button::after {
          top: -10px;
          left: 3%;
        }
        .orange-button::before {
          top: 80%;
          left: 3%;
        }
        .orange-button:hover::before,
        .orange-button:hover::after {
          transform: scale(0);
        }
        .orange-button:hover {
          box-shadow: inset 0px 0px 15px #ffc107;
          background-color: rgba(161, 128, 43, 0.1);
        }
        .red-button {
          color: #e0e0e0;
        }

        .red-button::after,
        .red-button::before {
          background-color: #1e1e1e;
        }
      }
    </style>
  </head>
  <body>
    <button class="floating-edit-button" onclick="goTo('visor.html')">
      Editar
    </button>

    <div class="container">
      <h1>Opciones del Test</h1>
      <div class="button-container">
        <button class="btn" onclick="goTo('alcanos.html')">Alcanos</button>
        <button class="btn" onclick="goTo('alquenosAlquinos.html')">
          Alquenos y alquinos
        </button>
        <button class="btn" onclick="goTo('hidrocarburosRamificados.html')">
          Hidrocarburos ramificados
        </button>
        <button class="btn" onclick="goTo('bencenos.html')">Bencenos</button
        ><br />
        <button class="btn" onclick="goTo('alcoholesEteres.html')">
          Alcoholes y éteres
        </button>
        <button class="btn" onclick="goTo('aldehidosCetonas.html')">
          Aldehídos y cetonas
        </button>
        <button class="btn" onclick="goTo('acidosEsteres.html')">
          Ácidos y ésteres
        </button>
        <button class="btn" onclick="goTo('aminasAmidasNitrilosNitro.html')">
          Aminas, amidas y grupos nitro
        </button>
      </div>
      <button class="red-button" onclick="goTo('general.html')">General</button>
      <button class="green-button" onclick="goTo('../indiceTest.html')">
        Ir al Indice
      </button>
      <button class="orange-button" onclick="goTo('../teoria/teoFormOr.html')">
        Teoría
      </button>
    </div>
    <script>
      // Función para redirigir a otra página
      function goTo(page) {
        window.location.href = page;
      }
    </script>
  </body>
</html>
